name: Prepare verifiable ChatGPT Library JSON transfer
on:
  push:
    branches: [main]
    paths:
      - 'public/market-history.json'
      - 'public/market-data.json'
      - 'public/index-ohlc-history.json'
      - 'public/market-center-history.json'
      - '.github/workflows/library-transfer-artifact.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *' # package fresh intraday snapshot before Library hourly sync
permissions:
  contents: write
concurrency:
  group: library-transfer-prep
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether a new artifact is needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          folder=pathlib.Path("public")
          required=["market-history.json","market-data.json","market-center-history.json"]
          if (folder/"intraday-market.json").exists():
            required.append("intraday-market.json")
          extra=sorted(p.name for p in folder.glob("*ohlc*.json"))
          names=list(dict.fromkeys(required+extra))
          current={}
          for name in names:
            raw=(folder/name).read_bytes()
            current[name]=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          index=pathlib.Path(".sync/library-transfer-artifact.json")
          prior={}
          if index.exists():
            try: prior=json.loads(index.read_text(encoding="utf-8"))
            except (ValueError, OSError): pass
          same=prior.get("sourceBlobFingerprints")==current
          created=prior.get("createdAt")
          fresh=False
          if created and prior.get("runId") and prior.get("artifactId"):
            try:
              stamp=datetime.datetime.fromisoformat(created.replace("Z","+00:00"))
              age=datetime.datetime.now(datetime.timezone.utc)-stamp.astimezone(datetime.timezone.utc)
              fresh=datetime.timedelta(0)<=age<datetime.timedelta(days=7)
            except (TypeError, ValueError): pass
          # Always rebuild after public-data pushes or explicit manual dispatch.
          rebuild=os.environ["EVENT_NAME"]!="schedule" or not (same and fresh)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
            out.write("package="+str(rebuild).lower()+"\n")
          print(json.dumps({"decision":"PACKAGE" if rebuild else "SKIP_NO_CHANGE",
                            "event":os.environ["EVENT_NAME"],"source_blob_match":same,
                            "artifact_under_7_days":fresh,"file_count":len(names)}))
          PY
      - name: Validate JSON and create byte-exact source manifest
        if: steps.gate.outputs.package == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          stage=pathlib.Path("library-transfer")
          stage.mkdir(exist_ok=True)
          required=["market-history.json","market-data.json","market-center-history.json"]
          if pathlib.Path("public/intraday-market.json").exists():
            required.append("intraday-market.json")
          extras=sorted(p.name for p in pathlib.Path("public").glob("*ohlc*.json"))
          names=list(dict.fromkeys(required+extras))
          files=[]
          for name in names:
            source=pathlib.Path("public")/name
            raw=source.read_bytes()
            doc=json.loads(raw)
            dest=stage/name
            shutil.copyfile(source,dest)
            files.append({"file":name,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),
              "git_blob_sha1":hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest(),
              "schema_version":doc.get("schemaVersion"),"rows":len(doc.get("rows",[])) if isinstance(doc.get("rows"),list) else None})
          (stage/"transfer-checksums.json").write_text(json.dumps({"files":files},ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(files,ensure_ascii=False))
          PY
      - name: Upload JSON transfer artifact
        if: steps.gate.outputs.package == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: jenbao-market-data-transfer
          path: library-transfer/
          retention-days: 10
          if-no-files-found: error
          compression-level: 6
      - name: Save downloadable artifact reference
        if: steps.gate.outputs.package == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p .sync
          python3 - <<'PY'
          import os,json,datetime,pathlib
          manifest=json.loads(pathlib.Path("library-transfer/transfer-checksums.json").read_text(encoding="utf-8"))
          source_blobs={entry["file"]:entry["git_blob_sha1"] for entry in manifest["files"]}
          obj={"runId":int(os.environ["RUN_ID"]),"artifactId":int(os.environ["ARTIFACT_ID"]),
               "repository":"KevinTaiwan/KevinTaiwan-jenbao-dashboard",
               "sourceHeadSha":os.environ["HEAD_SHA"],"createdAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "artifactName":"jenbao-market-data-transfer","compression":"zip",
               "sourceBlobFingerprints":source_blobs}
          pathlib.Path(".sync/library-transfer-artifact.json").write_text(json.dumps(obj,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .sync/library-transfer-artifact.json
          git diff --cached --quiet || (git commit -m 'Record library JSON transfer artifact [skip ci]' && git pull --rebase origin main && git push)

  research_history:
    # Independent result: never blocks the existing market transfer job.
    needs: package
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test collector and decide research slot
        id: research_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/collect_long_history.py --self-test
          # First pilot: DGS10 only, daily 17:25 Asia/Taipei (09 UTC).
          # Manual dispatch or explicit bootstrap may also collect.
          hour=$(date -u +%H)
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || [[ "$EVENT_NAME" == schedule && "$hour" == 09 ]] || [[ "$EVENT_NAME" == push && "$COMMIT_MESSAGE" == *"[research-bootstrap]"* ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "SKIP_RESEARCH_SLOT"
          fi
      - name: Collect public-domain FRED pilot
        if: steps.research_gate.outputs.collect == 'true'
        id: research
        run: |
          python3 scripts/collect_long_history.py
          git add -f -- research-data/fred/DGS10.csv research-data/fred/DGS10.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP_NO_RESEARCH_CHANGE"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload separate research artifact
        if: steps.research.outputs.changed == 'true'
        id: research_upload
        uses: actions/upload-artifact@v4
        with:
          name: jenbao-long-history-dgs10
          path: |
            research-data/fred/DGS10.csv
            research-data/fred/DGS10.json
          retention-days: 10
          if-no-files-found: error
      - name: Persist verified public-domain pilot and artifact reference
        if: steps.research.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.research_upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          p=pathlib.Path("research-data/fred/DGS10.csv")
          m=json.loads(p.with_suffix(".json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256"]
          ref={"runId":int(os.environ["RUN_ID"]),"artifactId":int(os.environ["ARTIFACT_ID"]),
               "artifactName":"jenbao-long-history-dgs10","series":"DGS10","manifest":m,
               "persistentPath":str(p),"quality":"source_csv_candidate"}
          pathlib.Path(".sync").mkdir(exist_ok=True)
          pathlib.Path(".sync/research-history-artifact.json").write_text(json.dumps(ref,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .sync/research-history-artifact.json
          git commit -m 'V15: update public-domain DGS10 research history [skip ci]'
          git pull --rebase origin main
          git push

  treasury_history:
    needs: package
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test and gate official Treasury archives
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/collect_treasury_archive.py --self-test
          hour=$(date -u +%H)
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || [[ "$EVENT_NAME" == schedule && "$hour" == 09 ]] || [[ "$EVENT_NAME" == push && "$COMMIT_MESSAGE" == *"[treasury-bootstrap]"* ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect nominal and real archives independently
        if: steps.gate.outputs.collect == 'true'
        id: archive
        run: |
          failed=0
          python3 scripts/collect_treasury_archive.py || failed=1
          python3 scripts/collect_treasury_archive.py --real || failed=1
          for name in par-yield-curve-rates-1990-2023 par-real-yield-curve-rates-2003-2023; do
            if [[ -f "research-data/treasury/$name.csv" && -f "research-data/treasury/$name.json" ]]; then
              git add -f -- "research-data/treasury/$name.csv" "research-data/treasury/$name.json"
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify staged archive SHA
        if: steps.archive.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("research-data/treasury")
          for p in root.glob("*.csv"):
              m=json.loads(p.with_suffix(".json").read_text())
              if hashlib.sha256(p.read_bytes()).hexdigest()!=m["sha256"]:
                  raise SystemExit("Treasury archive SHA mismatch")
          PY
      - name: Upload official archives separately
        if: steps.archive.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: jenbao-treasury-long-history
          path: research-data/treasury/
          retention-days: 10
          if-no-files-found: error
      - name: Save Treasury archive and transfer reference
        if: steps.archive.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("research-data/treasury")
          manifests=[json.loads(p.read_text()) for p in sorted(root.glob("*.json"))]
          ref={"runId":int(os.environ["RUN_ID"]),"artifactId":int(os.environ["ARTIFACT_ID"]),
               "artifactName":"jenbao-treasury-long-history","manifests":manifests,
               "persistentPath":str(root),"quality":"official_source_candidate"}
          pathlib.Path(".sync").mkdir(exist_ok=True)
          pathlib.Path(".sync/treasury-history-artifact.json").write_text(json.dumps(ref,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .sync/treasury-history-artifact.json
          git commit -m 'V15: persist official nominal and real Treasury archives [skip ci]'
          git pull --rebase origin main
          git push
      - name: Report partial or failed source access
        if: steps.archive.outputs.failed == '1'
        run: exit 1

  treasury_recent:
    needs: treasury_history
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test and gate recent Treasury collection
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/collect_treasury_recent.py --self-test
          hour=$(date -u +%H)
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || [[ "$EVENT_NAME" == schedule && "$hour" == 09 ]] || [[ "$EVENT_NAME" == push && "$COMMIT_MESSAGE" == *"[treasury-recent-bootstrap]"* ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect and validate annual official curves
        if: steps.gate.outputs.collect == 'true'
        id: recent
        run: |
          failed=0
          python3 scripts/collect_treasury_recent.py || failed=1
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path("research-data/treasury-recent")
          for p in sorted(root.glob("*.csv")):
              if not re.fullmatch(r"ust-(nominal|real)-20[0-9]{2}\.csv",p.name):
                  raise SystemExit("Unexpected research path")
              m=json.loads(p.with_suffix(".json").read_text())
              if hashlib.sha256(p.read_bytes()).hexdigest()!=m["sha256"]:
                  raise SystemExit("Treasury recent SHA mismatch")
              subprocess.run(["git","add","-f","--",str(p),str(p.with_suffix(".json"))],check=True)
          PY
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload annual Treasury research data
        if: steps.recent.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: jenbao-treasury-recent-history
          path: research-data/treasury-recent/
          retention-days: 10
          if-no-files-found: error
      - name: Persist annual Treasury data and pointer
        if: steps.recent.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("research-data/treasury-recent")
          manifests=[json.loads(p.read_text()) for p in sorted(root.glob("*.json"))]
          ref={"runId":int(os.environ["RUN_ID"]),"artifactId":int(os.environ["ARTIFACT_ID"]),
               "artifactName":"jenbao-treasury-recent-history","manifests":manifests,
               "persistentPath":str(root),"quality":"official_source_candidate"}
          pathlib.Path(".sync").mkdir(exist_ok=True)
          pathlib.Path(".sync/treasury-recent-artifact.json").write_text(json.dumps(ref,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .sync/treasury-recent-artifact.json
          git commit -m 'V15: persist recent official Treasury curves [skip ci]'
          git pull --rebase origin main
          git push
      - name: Report partial source access
        if: steps.recent.outputs.failed == '1'
        run: exit 1
 
  real_yield_build:
    needs: treasury_recent
    if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[real-yield-persist]'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build and verify official real yield series
        run: |
          python3 scripts/build_real_yield_public.py
          python3 scripts/build_real_yield_public.py --check
      - name: Upload verified derived series for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: jenbao-real-yield-derived
          path: |
            public/real-yield-history.json
            .sync/real-yield-calculations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 10
      - name: Persist verified calculation cache outside public site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p research-data/real-yield
          cp public/real-yield-history.json research-data/real-yield/history.json
          git add -- research-data/real-yield/history.json .sync/real-yield-calculations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Persist verified real yield research and calculation cache [skip ci]'
            git pull --rebase origin main
            git push
          fi
