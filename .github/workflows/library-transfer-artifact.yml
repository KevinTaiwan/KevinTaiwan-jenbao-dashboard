name: Prepare verifiable ChatGPT Library JSON transfer
on:
  push:
    branches: [main]
    paths:
      - 'public/market-history.json'
      - 'public/market-data.json'
      - 'public/index-ohlc-history.json'
      - 'public/market-center-history.json'
      - '.github/workflows/library-transfer-artifact.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *' # package fresh intraday snapshot before Library hourly sync
permissions:
  contents: write
concurrency:
  group: library-transfer-prep
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether a new artifact is needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          folder=pathlib.Path("public")
          required=["market-history.json","market-data.json","market-center-history.json"]
          if (folder/"intraday-market.json").exists():
            required.append("intraday-market.json")
          extra=sorted(p.name for p in folder.glob("*ohlc*.json"))
          names=list(dict.fromkeys(required+extra))
          current={}
          for name in names:
            raw=(folder/name).read_bytes()
            current[name]=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          index=pathlib.Path(".sync/library-transfer-artifact.json")
          prior={}
          if index.exists():
            try: prior=json.loads(index.read_text(encoding="utf-8"))
            except (ValueError, OSError): pass
          same=prior.get("sourceBlobFingerprints")==current
          created=prior.get("createdAt")
          fresh=False
          if created and prior.get("runId") and prior.get("artifactId"):
            try:
              stamp=datetime.datetime.fromisoformat(created.replace("Z","+00:00"))
              age=datetime.datetime.now(datetime.timezone.utc)-stamp.astimezone(datetime.timezone.utc)
              fresh=datetime.timedelta(0)<=age<datetime.timedelta(days=7)
            except (TypeError, ValueError): pass
          # Always rebuild after public-data pushes or explicit manual dispatch.
          rebuild=os.environ["EVENT_NAME"]!="schedule" or not (same and fresh)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
            out.write("package="+str(rebuild).lower()+"\n")
          print(json.dumps({"decision":"PACKAGE" if rebuild else "SKIP_NO_CHANGE",
                            "event":os.environ["EVENT_NAME"],"source_blob_match":same,
                            "artifact_under_7_days":fresh,"file_count":len(names)}))
          PY
      - name: Validate JSON and create byte-exact source manifest
        if: steps.gate.outputs.package == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          stage=pathlib.Path("library-transfer")
          stage.mkdir(exist_ok=True)
          required=["market-history.json","market-data.json","market-center-history.json"]
          if pathlib.Path("public/intraday-market.json").exists():
            required.append("intraday-market.json")
          extras=sorted(p.name for p in pathlib.Path("public").glob("*ohlc*.json"))
          names=list(dict.fromkeys(required+extras))
          files=[]
          for name in names:
            source=pathlib.Path("public")/name
            raw=source.read_bytes()
            doc=json.loads(raw)
            dest=stage/name
            shutil.copyfile(source,dest)
            files.append({"file":name,"bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),
              "git_blob_sha1":hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest(),
              "schema_version":doc.get("schemaVersion"),"rows":len(doc.get("rows",[])) if isinstance(doc.get("rows"),list) else None})
          (stage/"transfer-checksums.json").write_text(json.dumps({"files":files},ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(files,ensure_ascii=False))
          PY
      - name: Upload JSON transfer artifact
        if: steps.gate.outputs.package == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: jenbao-market-data-transfer
          path: library-transfer/
          retention-days: 10
          if-no-files-found: error
          compression-level: 6
      - name: Save downloadable artifact reference
        if: steps.gate.outputs.package == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p .sync
          python3 - <<'PY'
          import os,json,datetime,pathlib
          manifest=json.loads(pathlib.Path("library-transfer/transfer-checksums.json").read_text(encoding="utf-8"))
          source_blobs={entry["file"]:entry["git_blob_sha1"] for entry in manifest["files"]}
          obj={"runId":int(os.environ["RUN_ID"]),"artifactId":int(os.environ["ARTIFACT_ID"]),
               "repository":"KevinTaiwan/KevinTaiwan-jenbao-dashboard",
               "sourceHeadSha":os.environ["HEAD_SHA"],"createdAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "artifactName":"jenbao-market-data-transfer","compression":"zip",
               "sourceBlobFingerprints":source_blobs}
          pathlib.Path(".sync/library-transfer-artifact.json").write_text(json.dumps(obj,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .sync/library-transfer-artifact.json
          git diff --cached --quiet || (git commit -m 'Record library JSON transfer artifact [skip ci]' && git push)

  research_history:
    # Independent result: never blocks the existing market transfer job.
    needs: package
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test collector and decide research slot
        id: research_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/collect_long_history.py --self-test
          # First pilot: DGS10 only, daily 17:25 Asia/Taipei (09 UTC).
          # Manual dispatch or explicit bootstrap may also collect.
          hour=$(date -u +%H)
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || [[ "$EVENT_NAME" == schedule && "$hour" == 09 ]] || [[ "$EVENT_NAME" == push && "$COMMIT_MESSAGE" == *"[research-bootstrap]"* ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect=false" >> "$GITHUB_OUTPUT"
            echo "SKIP_RESEARCH_SLOT"
          fi
      - name: Collect public-domain FRED pilot
        if: steps.research_gate.outputs.collect == 'true'
        id: research
        run: |
          python3 scripts/collect_long_history.py
          git add -- research-data/fred/DGS10.csv research-data/fred/DGS10.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP_NO_RESEARCH_CHANGE"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload separate research artifact
        if: steps.research.outputs.changed == 'true'
        id: research_upload
        uses: actions/upload-artifact@v4
        with:
          name: jenbao-long-history-dgs10
          path: |
            research-data/fred/DGS10.csv
            research-data/fred/DGS10.json
          retention-days: 10
          if-no-files-found: error
      - name: Persist verified public-domain pilot and artifact reference
        if: steps.research.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.research_upload.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          p=pathlib.Path("research-data/fred/DGS10.csv")
          m=json.loads(p.with_suffix(".json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256"]
          ref={"runId":int(os.environ["RUN_ID"]),"artifactId":int(os.environ["ARTIFACT_ID"]),
               "artifactName":"jenbao-long-history-dgs10","series":"DGS10","manifest":m,
               "persistentPath":str(p),"quality":"source_csv_candidate"}
          pathlib.Path(".sync").mkdir(exist_ok=True)
          pathlib.Path(".sync/research-history-artifact.json").write_text(json.dumps(ref,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .sync/research-history-artifact.json
          git commit -m 'V15: update public-domain DGS10 research history [skip ci]'
          git pull --rebase origin main
          git push
