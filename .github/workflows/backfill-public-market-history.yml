name: Backfill verified public market history
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_public_market_history.py'
      - '.github/workflows/backfill-public-market-history.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * 1-5'
permissions:
  contents: write
concurrency:
  group: jenbao-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backfill verified market history (no estimated data)
        run: python3 scripts/backfill_public_market_history.py
      - name: Commit updated public market history
        run: |
          if git diff --quiet -- public/market-history.json; then
            echo "No verified new observations."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/market-history.json
          git commit -m 'Update verified 240-day market history'
          git push
