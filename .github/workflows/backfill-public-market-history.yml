name: Backfill verified public market history
on:
  # Full backfill is expensive; run on schedule or manually rather than every
  # script update (which competes with the daily publication).
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * 1-5'
permissions:
  contents: write
concurrency:
  group: jenbao-public-market-writer
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backfill verified market history (no estimated data)
        run: python3 scripts/backfill_public_market_history.py
      - name: Backfill TWSE foreign investment and margin history
        run: python3 scripts/backfill_twse_flows.py
      - name: Backfill TWSE market volume and day-trade ratios
        run: python3 scripts/backfill_twse_market_activity.py
      - name: Commit updated public market history
        run: |
          if git diff --quiet -- public/market-history.json; then
            echo "No verified new observations."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/market-history.json
          git commit -m 'Update verified 240-day market history'
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "FAIL: new overlapping observations require explicit reconciliation"
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "FAIL: concurrent branch updates; old history retained"
          exit 1
