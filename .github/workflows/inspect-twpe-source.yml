name: Inspect actual daily TAIEX market P/E data source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-twpe-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect embedded daily TAIEX P/E data and public API route (read-only)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re,json,html
          base='https://toalpha.tw'
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json,*/*'})
            with urllib.request.urlopen(req,timeout=20) as h:return h.read(5000000).decode('utf-8','replace')
          page=get(base+'/market')
          print('PAGE BYTES',len(page),flush=True)
          for word in ['大盤本益比','本益比','20 年位置','十年','歷史本益比','市值加權','PE\\"','本益比位置']:
            inds=[m.start() for m in re.finditer(re.escape(word),page)]
            print('WORD',word,'COUNT',len(inds),flush=True)
            for pos in inds[:7]:print('CONTEXT',repr(page[max(0,pos-120):pos+360]),flush=True)
          scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',page)
          scripts=[x for x in scripts if '/_next/static/' in x]
          print('SCRIPT COUNT',len(scripts),flush=True)
          for url in scripts:
            try:
              js=get(base+url)
              markers=['/api/market','/api/valuation','market/pe','pe-history','market-pe','twse','weightedPe','marketPe','marketPER','peRatio','pe_ratio','/api/']
              hits=[k for k in markers if k.lower() in js.lower()]
              if hits:
                print('SCRIPT HITS',url,'SIZE',len(js),'HITS',hits,flush=True)
                for needle in ['api/market','api/valuation','market/pe','pe-history','market-pe','weightedPe','marketPe','marketPER','peRatio','pe_ratio','/api/']:
                  p=js.lower().find(needle.lower())
                  if p>=0:print('MATCH',needle,repr(js[max(0,p-220):p+400]),flush=True)
            except Exception as e:print('JS ERROR',url,repr(e),flush=True)
          PY
