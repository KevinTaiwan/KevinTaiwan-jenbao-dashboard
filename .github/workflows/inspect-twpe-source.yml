name: Inspect historical market P/E payload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-twpe-source.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read public HTML payload and identify actual daily historical series
        run: |
          python3 - <<'PY'
          import urllib.request,re,json,html,collections
          with urllib.request.urlopen(urllib.request.Request('https://toalpha.tw/market',headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as response:
            txt=response.read(4000000).decode('utf-8','replace')
          keys=['pe','per','marketPe','marketPE','peRatio','pe_ratio','peHistory','valuation','TWPE','上市大盤本益比','2026-11-19','2026-11-18','2026-10-15','2025-12-31','2026-11-20','2026-08-01']
          print('HTML size',len(txt),'embedded payload count',txt.count('self.__next_f.push'),flush=True)
          for key in keys:
            for pattern in [key,chr(92)+chr(34)+key+chr(92)+chr(34)]:
              hits=[x.start() for x in re.finditer(re.escape(pattern),txt,re.I)]
              print('PATTERN',repr(pattern),'COUNT',len(hits),flush=True)
              for p in hits[:2]:
                print('SNIPPET',repr(txt[max(0,p-100):p+260]),flush=True)
          print('REACT CHUNKS',len(re.findall(r'self\.__next_f\.push',txt)),flush=True)
          print('TAGGED JSON-KEY PAIRS',collections.Counter(re.findall(r'\\\\"([a-zA-Z][a-zA-Z_0-9]{0,26})\\\\":',txt)).most_common(35),flush=True)
          PY
