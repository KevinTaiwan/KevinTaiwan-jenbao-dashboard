name: Inspect actual daily TAIEX market P/E data source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-twpe-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test daily market valuation source availability (read-only)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,html,json,datetime
          for url in ['https://toalpha.tw/market','https://www.twse.com.tw/rwd/zh/statistics/list?type=04&subType=220&response=json']:
            print('URL',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; market-data-quality-audit/1.0)'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                raw=resp.read(3000000)
                body=raw.decode('utf-8','replace')
                print('HTTP',resp.status,'BYTES',len(raw),'TYPE',resp.headers.get('Content-Type'),flush=True)
                print('HEAD',repr(body[:550]),flush=True)
                if 'toalpha.tw' in url:
                  for kw in ['本益比','__NEXT_DATA__','marketPe','market_pe','peRatio','pe_ratio','valuation','<script']:
                    print('MARKER',kw,'count',body.count(kw),flush=True)
                    for m in list(re.finditer(re.escape(kw),body,re.I))[:3]:
                      print('CONTEXT',repr(body[max(0,m.start()-140):m.start()+270]),flush=True)
                  for src in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',body)[:35]:
                    print('SCRIPT',src,flush=True)
                else:
                  try:
                    data=json.loads(body)
                    print('KEYS',list(data)[:20],flush=True)
                    print('FIRSTROW',str(data.get('data',[])[:2])[:500],flush=True)
                  except Exception as e:print('JSON_ERROR',repr(e),flush=True)
            except Exception as e:print('FAIL',repr(e),flush=True)
          PY
