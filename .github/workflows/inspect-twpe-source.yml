name: Audit daily TAIEX P/E historical extraction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-twpe-source.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Extract and inspect dated market P/E records without writing
        run: |
          python3 - <<'PY'
          import urllib.request,re,datetime,collections
          request=urllib.request.Request('https://toalpha.tw/market',headers={'User-Agent':'Mozilla/5.0 (public-market-data-audit)'})
          with urllib.request.urlopen(request,timeout=30) as response:body=response.read(5000000).decode('utf-8','replace')
          regex=r'\{\\"time\\":\\"(\d{4}-\d{2}-\d{2})\\"[^{}]{0,550}?\\"pe\\":(-?\d+(?:\.\d+)?)'
          matches=re.findall(regex,body)
          series={}
          duplicates=[]
          for date,value in matches:
            if date in series and series[date]!=float(value): duplicates.append((date,series[date],float(value)))
            series[date]=float(value)
          ordered=sorted(series.items())
          print('EXTRACTED',len(matches),'UNIQUE',len(series),'CONFLICTS',len(duplicates))
          print('FIRST',ordered[:8])
          print('LAST',ordered[-12:])
          print('RECENT_240',len(ordered[-240:]),'FROM',ordered[-240][0] if len(ordered)>=240 else None,'TO',ordered[-1][0] if ordered else None)
          print('LATEST_VALUE',ordered[-1][1] if ordered else None)
          print('DATA_GAPS',[(ordered[i][0],ordered[i+1][0]) for i in range(max(0,len(ordered)-40),len(ordered)-1) if (datetime.date.fromisoformat(ordered[i+1][0])-datetime.date.fromisoformat(ordered[i][0])).days>4])
          assert len(ordered)>=240 and not duplicates
          assert all(0<v<150 for _,v in ordered[-240:])
          PY
