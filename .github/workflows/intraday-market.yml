name: Intraday index OHLC every 5 minutes
on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jenbao-intraday-market
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch provisional five-minute market OHLC and verified turnover
        env:
          JENBAO_VERIFIED_TWD_TURNOVER_URL: ${{ secrets.JENBAO_VERIFIED_TWD_TURNOVER_URL }}
          JENBAO_TURNOVER_API_KEY: ${{ secrets.JENBAO_TURNOVER_API_KEY }}
        run: |
          python3 scripts/collect_intraday_market.py
          if test -f public/intraday-market.json; then python3 scripts/validate_intraday_market.py public/intraday-market.json; fi
      - name: Commit only changed public intraday quotes
        run: |
          if git diff --quiet -- public/intraday-market.json; then
            echo "No new actual quote candles or market closed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/intraday-market.json
          git commit -m 'Refresh intraday 5m market OHLC [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
