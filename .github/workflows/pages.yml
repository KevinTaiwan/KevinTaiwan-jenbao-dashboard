name: Deploy Personal CIO Desk - Public Market Only
on:
  # Explicitly deploy after archival workflow completes. GITHUB_TOKEN commits
  # alone do not trigger downstream push workflows.
  workflow_run:
    workflows: ["Permanent TAIEX and S&P 500 Daily OHLC Archive"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/validate_public.py'
      - 'scripts/refresh_market_history.py'
      - 'scripts/sync_market_snapshot.py'
      - 'scripts/public_market_calculations.py'
      - 'scripts/tests/test_public_market_calculations.py'
      - 'scripts/tests/test_v18_hourly.py'
      - 'scripts/stage_public_news.py'
      - 'scripts/validate_public_news.py'
      - 'scripts/tests/test_public_news_stage.py'
      - 'scripts/refresh_market_center_history.py'
      - 'scripts/backfill_twse_market_activity.py'
      - 'scripts/market_seed.json'
      - 'scripts/ex_etf_maintenance_seed.json'
      - 'scripts/validate_market_history.py'
      - 'scripts/refresh_index_ohlc.py'
      - 'scripts/validate_index_ohlc.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # V18 hourly; 06:00 Taipei retains the daily deep refresh
permissions:
  contents: write
  pages: write
  id-token: write
# Shared write mutex: deployment/summary and long history backfill cannot
# publish competing revisions of public/market-history.json concurrently.
concurrency:
  group: jenbao-public-market-writer
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # workflow_run points at the triggering run; deploy latest main.
          ref: main
      - name: Test material-change write gate (no network)
        run: python3 -m unittest discover -s scripts/tests -p 'test_market_material_write.py'
      - name: V18 offline regression gate
        run: |
          python3 -m py_compile scripts/refresh_market_history.py scripts/sync_market_snapshot.py
          python3 -m unittest discover -s scripts/tests -p 'test_v18_hourly.py'
          python3 -m unittest discover -s scripts/tests -p 'test_public_news_stage.py'
      - name: Refresh public market-history from official and attributable sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || contains(github.event.head_commit.message, '[refresh-all]') || contains(github.event.head_commit.message, '[refresh-hourly]') || contains(github.event.head_commit.message, '[refresh-yields]') || contains(github.event.head_commit.message, '[refresh-etfs]')
        env:
          JENBAO_YIELD_ONLY: ${{ contains(github.event.head_commit.message, '[refresh-yields]') && '1' || '0' }}
          JENBAO_HOURLY: ${{ (github.event_name == 'schedule' || contains(github.event.head_commit.message, '[refresh-hourly]')) && '1' || '0' }}
          V18_EVENT_NAME: ${{ github.event_name }}
          JENBAO_ETF_ONLY: ${{ contains(github.event.head_commit.message, '[refresh-etfs]') && '1' || '0' }}
        run: |
          # Preserve the daily extended backfill and manual full-refresh path.
          # The separate daily OHLC workflow completion also triggers a full refresh.
          if [ "$V18_EVENT_NAME" = schedule ] && [ "$(TZ=Asia/Taipei date +%H)" = 06 ]; then export JENBAO_HOURLY=0; fi
          echo "V18_COLLECTION_MODE hourly=$JENBAO_HOURLY event=$V18_EVENT_NAME"
          python3 scripts/refresh_market_history.py
          python3 scripts/validate_market_history.py public/market-history.json
      - name: Increment market-center observations (FRED, Yahoo and official TWSE)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || contains(github.event.head_commit.message, '[refresh-all]') || contains(github.event.head_commit.message, '[refresh-hourly]')
        run: |
          python3 -u scripts/refresh_market_center_history.py
      - name: Increment official TWSE turnover and day-trade value
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || contains(github.event.head_commit.message, '[refresh-all]') || contains(github.event.head_commit.message, '[refresh-hourly]')
        env:
          JENBAO_TWSE_INCREMENTAL: '1'
        run: |
          python3 -u scripts/backfill_twse_market_activity.py
          python3 scripts/validate_market_history.py public/market-history.json
      - name: Sync published summary to individually dated observed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || contains(github.event.head_commit.message, '[refresh-all]') || contains(github.event.head_commit.message, '[refresh-hourly]') || contains(github.event.head_commit.message, '[refresh-yields]') || contains(github.event.head_commit.message, '[refresh-etfs]')
        run: |
          python3 scripts/sync_market_snapshot.py
          python3 scripts/validate_public.py public/market-data.json
      - name: V18 dated observation receipt
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || contains(github.event.head_commit.message, '[refresh-all]') || contains(github.event.head_commit.message, '[refresh-hourly]') || contains(github.event.head_commit.message, '[refresh-yields]') || contains(github.event.head_commit.message, '[refresh-etfs]')
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("public")
          names=("market-history.json","market-data.json","market-center-history.json")
          hashes={n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in names}
          h=json.loads((root/names[0]).read_text(encoding="utf-8"))
          s=json.loads((root/names[1]).read_text(encoding="utf-8"))
          center=json.loads((root/names[2]).read_text(encoding="utf-8"))
          a=h["marginMaintenance240dAudit"]
          stats=h["stats"]["marginMaintenanceExEtf"]
          m=s["market"]
          if m["marginMaintenanceAsOf"]!=stats["last"] or m["marginMaintenance"]!=stats["lastValue"]:
              raise SystemExit("FAIL: margin summary/history mismatch")
          cv=s["marginMaintenanceCoverage"]
          if (cv["targetLast"],cv["observedTradingDays"],cv["missingTradingDays"])!=(a["targetLast"],a["observed"],a["missing"]):
              raise SystemExit("FAIL: margin coverage mismatch")
          receipt={"event":"V18_OBSERVATION_RECEIPT","sha256":hashes,
                   "latest_observations":{k:v.get("last") for k,v in h["stats"].items()},
                   "center_observations":{k:v[-1][0] for k,v in center.items() if isinstance(v,list) and v and isinstance(v[-1],list)},
                   "margin":{"date":stats["last"],"value":stats["lastValue"],"missing":a["missingDates"]},
                   "scope":"archive consistency only; source freshness follows independent source release calendars"}
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - name: Commit validated public market-history snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || contains(github.event.head_commit.message, '[refresh-all]') || contains(github.event.head_commit.message, '[refresh-hourly]') || contains(github.event.head_commit.message, '[refresh-yields]') || contains(github.event.head_commit.message, '[refresh-etfs]')
        run: |
          # Validate all public files before any push; deployment validation is repeated later.
          python3 scripts/validate_public.py public/market-data.json
          python3 scripts/validate_market_history.py public/market-history.json
          if test -f public/index-ohlc-history.json; then python3 scripts/validate_index_ohlc.py public/index-ohlc-history.json; fi
          if test -f public/intraday-market.json; then python3 scripts/validate_intraday_market.py public/intraday-market.json; fi
          git config user.name "jenbao-market-bot"
          git config user.email "jenbao-market-bot@users.noreply.github.com"
          git add public/market-history.json public/market-data.json public/market-center-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh validated public market history and summary [skip ci]"
            # No rebase of an already calculated observation receipt onto changed inputs.
            if ! git push origin HEAD:main; then
              echo "FAIL: main advanced; keep previous verified generation and retry on existing trigger"
              exit 1
            fi
          fi
      - name: Verify public-only directory and JSON
        run: |
          python3 scripts/validate_public.py public/market-data.json
          python3 scripts/validate_market_history.py public/market-history.json
          if test -f public/index-ohlc-history.json; then python3 scripts/validate_index_ohlc.py public/index-ohlc-history.json; fi
          if test -f public/intraday-market.json; then python3 scripts/validate_intraday_market.py public/intraday-market.json; fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          import math
          from datetime import date
          allowed={'market-center-history.json','index.html','market-data.json','market-history.json','index-ohlc-history.json','intraday-market.json','fedwatch-history.json','public-news-events.json','.nojekyll'}
          files={p.name for p in Path('public').rglob('*') if p.is_file()}
          if files-allowed:raise SystemExit('Unsafe unexpected public files: '+repr(files-allowed))
          # Only the exact reviewed empty placeholder is approved for publication.
          fedwatch=Path('public/fedwatch-history.json')
          if fedwatch.exists():
              import hashlib
              raw=fedwatch.read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if blob!='f88cd588596e502d05300c0fd0a1598dc484f4dc':
                  raise SystemExit('FedWatch changed: require public schema and rights review')
              fw=json.loads(raw)
              if fw.get('audience')!='public-market' or fw.get('records')!=[] or fw.get('coverage',{}).get('observedTradingDays')!=0:
                  raise SystemExit('Invalid FedWatch placeholder')
          # R10.3: exact reviewed public bytes independently pinned in workflow.
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/validate_public_news.py', '--approved-sha256', '26a2e03f56cc40d4e7fd4064656fe7f04fceed03bd3e9e5f6b72efd1542846e7'], check=True)
          # Cold-start fallback must be exactly the separately approved public release.
          html=Path('public/index.html').read_text(encoding='utf-8')
          marker='const TECH_APPROVED_NEWS_SNAPSHOT='
          if html.count(marker)!=1: raise SystemExit('Missing/duplicate news fallback')
          embedded,_=json.JSONDecoder().raw_decode(html.split(marker,1)[1])
          if embedded!=json.loads(Path('public/public-news-events.json').read_text(encoding='utf-8')):
              raise SystemExit('News fallback differs from approved public file')
          center_path=Path('public/market-center-history.json')
          if center_path.exists():
              series=json.loads(center_path.read_text(encoding='utf-8'))
              expected=set(["006208TW","2330TW","DRTSCILM","IXIC","PAYEMS","PCEC96","RSAFS","SOX","UMCSENT","acm10","cccOas","cccYield","cnnFearGreed","delinq","foreignTxOpenInterestNetContracts","forwardPe","gdp","goldFuturesUsd","goldSpot","inflation5y5y","iorb","marginBalanceYi","mortgage","move","nfci","orders","singleBOas","sofr","sofrMinusIorbBp","t10yie","t5yie","tgcr","twNet","twPb","twPe","us1y","us2y","us30y","us3y","us5y","willing","wtiFuturesUsd"])
              archival={'twPeMonthly','twPeSource'}
              if not isinstance(series, dict) or set(series) != expected | archival:
                  raise SystemExit('Unexpected market center series')
              provenance=series['twPeSource']
              if (not isinstance(provenance,dict)
                  or len(series.get('twPe',[])) < 900
                  or provenance.get('observations') != len(series['twPe'])
                  or provenance.get('missing_sessions') != 0
                  or provenance.get('official_twse_monthly') is not False
                  or provenance.get('archived_monthly_series') != 'twPeMonthly'):
                  raise SystemExit('Invalid daily market PE provenance or count')
              if len(series.get('twPeMonthly',[])) < 2:
                  raise SystemExit('Old monthly market PE must be retained')
              for key, rows in series.items():
                  if key=='twPeSource':continue
                  if not isinstance(rows, list) or not rows:
                      raise SystemExit(f'Missing market center observations: {key}')
                  previous = ''
                  for row in rows:
                      if not isinstance(row, list) or len(row) != 2:
                          raise SystemExit(f'Invalid market center observation: {key}')
                      day, value = row
                      if (not isinstance(day, str) or date.fromisoformat(day).isoformat() != day
                              or day <= previous or type(value) not in (int, float)
                              or not math.isfinite(value)):
                          raise SystemExit(f'Invalid market center observation: {key}')
                      previous = day
          if '<script src=' in Path('public/index.html').read_text():raise SystemExit('External script is not allowed')
          print('Public-only deployment checks: PASS')
          PY
      - name: Verify browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          if '<script>' not in html or '</script>' not in html:
              raise SystemExit('FAIL: browser JavaScript is missing')
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/jenbao-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/jenbao-inline.js
      - name: Check public deployment fingerprint
        id: pages_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path("public")
          files=sorted(p for p in root.rglob("*") if p.is_file())
          h=hashlib.sha256()
          sha={}
          for p in files:
              name=p.relative_to(root).as_posix()
              raw=p.read_bytes()
              h.update(name.encode("utf-8"))
              h.update(bytes([0]))
              h.update(len(raw).to_bytes(8,"big"))
              h.update(raw)
              sha[name]=hashlib.sha256(raw).hexdigest()
          fingerprint=h.hexdigest()
          marker=pathlib.Path(".sync/pages-deployment.json")
          previous={}
          if marker.exists():
              try:
                  previous=json.loads(marker.read_text(encoding="utf-8"))
              except (ValueError,OSError):
                  print("WARN: existing deployment marker unreadable; deploy fail-open")
          equal=previous.get("publicFingerprint")==fingerprint
          # A manual run is an explicit deployment request even if public bytes match.
          deploy=(os.environ.get("EVENT_NAME")=="workflow_dispatch") or not equal
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("deploy="+("true" if deploy else "false")+"\n")
              out.write("fingerprint="+fingerprint+"\n")
          pathlib.Path("/tmp/jenbao-pages-deploy-manifest.json").write_text(
              json.dumps({"schemaVersion":1,"publicFingerprint":fingerprint,
                          "publicFileSha256":sha},sort_keys=True,indent=2)+"\n",
              encoding="utf-8")
          print(json.dumps({"status":"DEPLOY" if deploy else "SKIP_NO_PUBLIC_CHANGE",
                            "event":os.environ.get("EVENT_NAME"),"public_files":len(files),
                            "fingerprint":fingerprint,"matched_last_success":equal}))
          PY
      - name: Configure GitHub Pages
        if: steps.pages_gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload only public files
        if: steps.pages_gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Allow uploaded Pages artifact metadata to become visible
        if: steps.pages_gate.outputs.deploy == 'true'
        run: sleep 30
      - name: Deploy to GitHub Pages
        if: steps.pages_gate.outputs.deploy == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Record last successful public deployment fingerprint
        if: steps.pages_gate.outputs.deploy == 'true' && steps.deploy.outcome == 'success'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          item=json.loads(pathlib.Path("/tmp/jenbao-pages-deploy-manifest.json").read_text(encoding="utf-8"))
          item["workflowRunId"]=int(os.environ["RUN_ID"])
          item["sourceCommit"]=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          item["deployedAt"]=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p=pathlib.Path(".sync/pages-deployment.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(item,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .sync/pages-deployment.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record successful public Pages fingerprint [skip ci]'
            for i in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            echo 'FAIL: deployment succeeded but its SHA marker could not be saved'
            exit 1
          fi

      - name: Compute public market statistics after validated deployment
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_public_market_calculations.py'
          python3 scripts/public_market_calculations.py
          git config user.name "jenbao-market-bot"
          git config user.email "jenbao-market-bot@users.noreply.github.com"
          git add .sync/public-market-calculations.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public market calculation cache [skip ci]"
            # Never rebase a derived cache onto different input data.
            git push origin HEAD:main
          fi
